<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - JobBoard</title>
</head>
<body>

<h1>Login</h1>

<form method="POST">
    {{ form.hidden_tag() }}

    <p>
        {{ form.email.label }}<br>
        {{ form.email() }}
    </p>

    <p>
        {{ form.password.label }}<br>
        {{ form.password() }}
    </p>

    <p>
        {{ form.submit() }}
    </p>
</form>

<p>
    Don't have an account?
    <a href="{{ url_for('register') }}">Register</a>
</p>

</body>
</html>
